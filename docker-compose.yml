services:
  api:
    build: .
    container_name: primogreedy-api
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - .:/app
    environment:
      - DUCKDB_PATH=/app/data.duckdb
      - VPS_API_KEY=${VPS_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
